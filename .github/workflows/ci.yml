name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x install.sh scripts/*.sh

  dry-run-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dry-run full setup
        run: make dry-run
      - name: Validate Brewfile syntax
        run: brew bundle list --file=Brewfile --all >/dev/null
